<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4fa">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Печать · English</title>
<style>
:root{--bg:#f3f4fa;--card:#fff;--soft:#eceef7;--tx:#141933;--mu:#6b7190;--bd:rgba(20,25,70,.08);--sh:0 8px 28px rgba(35,40,100,.08);--ac:#2563eb;--at:rgba(37,99,235,.12);--ok:#059669;--okt:rgba(16,185,129,.14);--wr:#e11d48;--wrt:rgba(244,63,94,.14);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d17;--card:#151929;--soft:#1f2438;--tx:#eef0fb;--mu:#8a90ad;--bd:rgba(255,255,255,.07);--sh:0 8px 28px rgba(0,0,0,.35);--ac:#60a5fa;--at:rgba(96,165,250,.14);--ok:#34d399;--okt:rgba(52,211,153,.14);--wr:#fb7185;--wrt:rgba(251,113,133,.16);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d17;--card:#151929;--soft:#1f2438;--tx:#eef0fb;--mu:#8a90ad;--bd:rgba(255,255,255,.07);--sh:0 8px 28px rgba(0,0,0,.35);--ac:#60a5fa;--at:rgba(96,165,250,.14);--ok:#34d399;--okt:rgba(52,211,153,.14);--wr:#fb7185;--wrt:rgba(251,113,133,.16);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:760px;min-height:100vh;color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 40px;background:radial-gradient(520px 320px at 0% -60px,rgba(37,99,235,.2),transparent 70%),radial-gradient(480px 300px at 100% -40px,rgba(6,182,212,.16),transparent 70%),var(--bg);background-repeat:no-repeat}
a.back{color:var(--ac);font-weight:700;text-decoration:none;display:inline-block;padding:6px 0}
h1{font-size:26px;margin:6px 0 2px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border-radius:22px;padding:18px;margin:0 0 12px;box-shadow:var(--sh);border:1px solid var(--bd)}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:14px;padding:4px;margin:12px 0}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:11px;font:inherit;font-weight:700;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ac);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.seg.small{margin:0 0 6px}.seg.small button{padding:6px 4px;font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:4px 2px 12px;font-size:14px;color:var(--mu)}
.tools label{display:flex;gap:6px;align-items:center;cursor:pointer}
.tools select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:5px 8px}
.tip{margin:6px 2px 10px;font-size:13px}
.stats{font-size:13px;margin:0 2px 12px}

.dhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.chat{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.msg{max-width:85%;padding:8px 12px;border-radius:16px;font-size:15px;opacity:.75}
.msg small{display:block;color:var(--mu);font-size:12px}
.msg.A{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.msg.B{align-self:flex-end;background:var(--at);border-bottom-right-radius:4px}
.who{font-weight:700;color:var(--mu);font-size:14px;margin:4px 0;display:flex;align-items:center;gap:8px}
.say{border:0;background:var(--soft);border-radius:10px;padding:2px 8px;cursor:pointer;font-size:15px}

.line{font:500 26px/1.6 "Cascadia Mono","Consolas","SF Mono",monospace;letter-spacing:.5px;padding:14px 16px;border-radius:16px;background:var(--soft);word-break:break-word;cursor:text}
.line .p{color:var(--mu)}
.line .ok{color:var(--tx)}
.line .bad{color:var(--wr);background:var(--wrt);border-radius:3px}
.line .cur{color:var(--tx);border-bottom:3px solid var(--ac);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{border-color:transparent}}
.trn{margin:10px 4px 0;color:var(--mu);font-size:15px}
.trn b{color:var(--tx);font-weight:600}

.kb{margin-top:18px;display:flex;flex-direction:column;gap:5px;align-items:center;user-select:none}
.kr{display:flex;gap:5px}
.kr.r1{margin-left:22px}.kr.r2{margin-left:34px}.kr.r3{margin-left:-10px}
.k{width:38px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:600 13px/1 system-ui,sans-serif;border:1px solid var(--bd);border-bottom-width:3px;background:var(--card);color:var(--mu);position:relative}
.k.bump::after{content:"";position:absolute;bottom:5px;width:10px;height:2px;border-radius:2px;background:var(--mu)}
.k.sh{width:86px}.k.space{width:260px}
/* цвет пальцев: слабый фон, ярко — клавиша, которую жать сейчас */
.f-lp,.f-rp{background:color-mix(in srgb,#a78bfa 14%,var(--card))}
.f-lr,.f-rr{background:color-mix(in srgb,#38bdf8 14%,var(--card))}
.f-lm,.f-rm{background:color-mix(in srgb,#34d399 14%,var(--card))}
.f-li,.f-ri{background:color-mix(in srgb,#fbbf24 16%,var(--card))}
.k.on{background:var(--ac);color:#fff;border-color:var(--ac);transform:translateY(1px)}
.finger{text-align:center;color:var(--mu);font-size:13px;margin-top:8px;min-height:18px}

.done{text-align:center;padding:10px 0 2px;font-size:20px;font-weight:700}
.done .mu{font-weight:400;margin:4px 0 14px}
.btn{display:block;width:100%;max-width:360px;margin:0 auto 10px;padding:13px;border-radius:16px;border:0;background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.g{background:var(--soft);color:var(--ac)}
#hidden{position:fixed;left:-1000px;top:0;opacity:0}
@media (max-width:620px){.k{width:26px;height:30px;font-size:11px}.k.sh{width:56px}.k.space{width:170px}.line{font-size:20px}.kr.r1{margin-left:12px}.kr.r2{margin-left:20px}}
</style>
</head><body>
<a class="back" href="./">‹ Английский</a>
<h1>⌨ Печать</h1>
<div class="mu">Игра для отдыха: без таймера и штрафов. Печатай спокойно, ошибки просто подсвечиваются. Раскладку переключать не нужно.</div>

<div class="seg" id="modes">
  <button data-m="finger">🖐 Пальцы</button>
  <button data-m="words">📚 Слова</button>
  <button data-m="dialog">💬 Диалоги</button>
</div>

<div class="tools">
  <select id="list"></select>
  <label><input type="checkbox" id="opt-tr"> перевод</label>
  <label><input type="checkbox" id="opt-kb"> клавиатура-подсказка</label>
</div>

<div class="card" id="game"></div>
<p class="mu stats" id="stats"></p>
<input id="hidden" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">

<script src="type-data.js"></script>
<script src="type.js"></script>
</body></html>
